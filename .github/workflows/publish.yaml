name: Publish

on:
  push:
    branches:
      - main          # publishes :latest on every merge to main
    tags:
      - 'v*'          # publishes :vX.Y.Z on version tags

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # :latest  — only when pushing to main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # :vX.Y.Z  — only when pushing a version tag
            type=semver,pattern={{version}}
            # :vX.Y    — minor alias on version tags
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_OPENAI_API_KEY=${{ secrets.VITE_OPENAI_API_KEY }}
            VITE_OPENAI_API_ENDPOINT=${{ secrets.VITE_OPENAI_API_ENDPOINT }}
            VITE_LLM_MODEL_NAME=${{ secrets.VITE_LLM_MODEL_NAME }}
            VITE_HIDE_CHARTDB_CLOUD=${{ vars.VITE_HIDE_CHARTDB_CLOUD }}
            VITE_DISABLE_ANALYTICS=${{ vars.VITE_DISABLE_ANALYTICS }}
            VITE_APP_PASSWORD=${{ secrets.VITE_APP_PASSWORD }}
